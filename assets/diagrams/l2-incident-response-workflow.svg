<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img"><title>SOC L2 incident response workflow</title><rect width="960" height="700" rx="14" fill="#0d1117"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/></marker></defs><text x="36" y="52" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#e6edf3" >SOC L2 Incident Response Workflow</text><text x="36" y="80" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8b949e" >Five escalated incidents for a fictional MSSP client · worked from L1 handoff to client notification</text><rect x="36" y="130" width="272" height="150" rx="10" fill="#161b22" stroke="#30363d"/><rect x="36" y="130" width="5" height="150" rx="2" fill="#58a6ff"/><text x="56" y="158" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#58a6ff" letter-spacing="1.4">STAGE 1</text><text x="56" y="186" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#e6edf3" >L1 escalation</text><text x="56" y="214" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" >Ticket lands in SOC-L2</text><text x="56" y="235" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" >Escalation note + linked alerts</text><text x="56" y="256" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" >P1–P4 with SLA clock</text><rect x="344" y="130" width="272" height="150" rx="10" fill="#161b22" stroke="#30363d"/><rect x="344" y="130" width="5" height="150" rx="2" fill="#58a6ff"/><text x="364" y="158" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#58a6ff" letter-spacing="1.4">STAGE 2</text><text x="364" y="186" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#e6edf3" >Accept &amp; review</text><text x="364" y="214" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" >Rate the L1 handoff</text><text x="364" y="235" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" >Times · entities · IOCs · ask</text><text x="364" y="256" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" >Feedback when it falls short</text><rect x="652" y="130" width="272" height="150" rx="10" fill="#161b22" stroke="#30363d"/><rect x="652" y="130" width="5" height="150" rx="2" fill="#d29922"/><text x="672" y="158" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#d29922" letter-spacing="1.4">STAGE 3</text><text x="672" y="186" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#e6edf3" >Scope</text><text x="672" y="214" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" >Pivot on every entity</text><text x="672" y="235" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" >SPL + KQL hunts across sources</text><text x="672" y="256" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" >Who, what, how far, still active?</text><rect x="652" y="330" width="272" height="150" rx="10" fill="#161b22" stroke="#30363d"/><rect x="652" y="330" width="5" height="150" rx="2" fill="#f85149"/><text x="672" y="358" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#f85149" letter-spacing="1.4">STAGE 4</text><text x="672" y="386" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#e6edf3" >Contain</text><text x="672" y="414" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" >Isolate · revoke · reset · block</text><text x="672" y="435" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" >Within L2 authority</text><text x="672" y="456" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" >Emergency change above it</text><rect x="344" y="330" width="272" height="150" rx="10" fill="#161b22" stroke="#30363d"/><rect x="344" y="330" width="5" height="150" rx="2" fill="#a371f7"/><text x="364" y="358" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#a371f7" letter-spacing="1.4">STAGE 5</text><text x="364" y="386" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#e6edf3" >Report</text><text x="364" y="414" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" >Executive summary + timeline</text><text x="364" y="435" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" >Root cause · actions · IOCs</text><text x="364" y="456" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" >Client notification</text><rect x="36" y="330" width="272" height="150" rx="10" fill="#161b22" stroke="#30363d"/><rect x="36" y="330" width="5" height="150" rx="2" fill="#3fb950"/><text x="56" y="358" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#3fb950" letter-spacing="1.4">STAGE 6</text><text x="56" y="386" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#e6edf3" >Disposition</text><text x="56" y="414" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" >Resolve at L2, or</text><text x="56" y="435" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" >escalate to Tier 3 for forensics,</text><text x="56" y="456" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" >hunting or breach assessment</text><line x1="312" y1="205.0" x2="338" y2="205.0" stroke="#6e7681" stroke-width="2" marker-end="url(#ah)"/><line x1="620" y1="205.0" x2="646" y2="205.0" stroke="#6e7681" stroke-width="2" marker-end="url(#ah)"/><line x1="788.0" y1="284" x2="788.0" y2="324" stroke="#6e7681" stroke-width="2" marker-end="url(#ah)"/><line x1="648" y1="405.0" x2="622" y2="405.0" stroke="#6e7681" stroke-width="2" marker-end="url(#ah)"/><line x1="340" y1="405.0" x2="314" y2="405.0" stroke="#6e7681" stroke-width="2" marker-end="url(#ah)"/><text x="36" y="522" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#58a6ff" letter-spacing="1.5">EVIDENCE SOURCES</text><rect x="36" y="534" width="139" height="30" rx="15" fill="#161b22" stroke="#30363d"/><text x="49" y="554" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#c9d1d9" >Windows Security</text><rect x="185" y="534" width="68" height="30" rx="15" fill="#161b22" stroke="#30363d"/><text x="198" y="554" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#c9d1d9" >Sysmon</text><rect x="263" y="534" width="82" height="30" rx="15" fill="#161b22" stroke="#30363d"/><text x="276" y="554" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#c9d1d9" >Entra ID</text><rect x="355" y="534" width="132" height="30" rx="15" fill="#161b22" stroke="#30363d"/><text x="368" y="554" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#c9d1d9" >Exchange Online</text><rect x="497" y=