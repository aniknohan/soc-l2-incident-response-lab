 SPL hunts</text><rect x="612" y="612" width="104" height="30" rx="15" fill="#161b22" stroke="#30363d"/><text x="625" y="632" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#c9d1d9" >9 KQL hunts</text><rect x="726" y="612" width="125" height="30" rx="15" fill="#161b22" stroke="#30363d"/><text x="739" y="632" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#c9d1d9" >5 L2 playbooks</text><text x="36" y="682" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6e7681" >INC-2031 phishing · INC-2032 BEC · INC-2033 password spray · INC-2034 ransomware precursor · INC-2035 web shell</text></svg>