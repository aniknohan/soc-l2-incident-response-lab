title: 'Kerberos Pre-Authentication Failures Indicating Password Spray'
id: 3f7a6070-caf2-5389-b637-c88a187a0bc2
status: experimental
description: 'Detects Kerberos pre-authentication failures (4771, bad password). Aggregate by source IP: more than 10 distinct accounts from one IP in 30 minutes indicates password spraying, as seen in INC-2033.'
references:
  - https://attack.mitre.org/
author: Anik Nohan
date: 2026-11-08
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4771
    Status: '0x18'
  condition: selection
fields:
  - IpAddress
  - TargetUserName
falsepositives:
  - Users with stale cached passwords (one account, many failures, internal source)
  - Mobile mail clients after a password change
level: medium
tags:
  - attack.credential-access
  - attack.t1110.003
