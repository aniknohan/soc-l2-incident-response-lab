title: 'Backup Service Account Network Logon from a Workstation'
id: 9fa8b053-c15d-5313-8286-ce70f5ba584d
status: experimental
description: 'Detects svc_backup authenticating from a user workstation subnet instead of its backup server, the lateral movement seen in COR-1022.'
references:
  - https://attack.mitre.org/
author: Anik Nohan
date: 2026-11-08
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4624
    LogonType: 3
    TargetUserName: 'svc_backup'
  filter_backup_server:
    IpAddress: '10.10.1.50'
  condition: selection and not filter_backup_server
fields:
  - IpAddress
  - WorkstationName
  - Computer
falsepositives:
  - Backup server IP change (update the filter)
level: high
tags:
  - attack.lateral-movement
  - attack.t1021.002
  - attack.t1078.002
